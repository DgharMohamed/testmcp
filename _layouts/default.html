<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-logo">
        <span class="logo-icon">🔌</span> MCP
      </a>
      <div class="nav-links">
        <a href="#what">What</a>
        <a href="#why">Why</a>
        <a href="#how">How</a>
        <a href="#setup">Setup</a>
        <a href="https://modelcontextprotocol.io" target="_blank" class="nav-cta">Docs &#x2197;</a>
      </div>
    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-inner">
      <p>
        Built with <span style="color:#FF6B6B">&hearts;</span> using
        <a href="https://kiro.dev" target="_blank">Kiro IDE</a> + GitHub MCP
        &nbsp;&middot;&nbsp;
        <a href="https://github.com/DgharMohamed/testmcp" target="_blank">View on GitHub</a>
      </p>
    </div>
  </footer>

  <script>
    const observer = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); }),
      { threshold: 0.1 }
    );
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Active nav link on scroll
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('.nav-links a[href^="#"]');
    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(s => {
        if (window.scrollY >= s.offsetTop - 120) current = s.id;
      });
      navLinks.forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + current);
      });
    });
  </script>

</body>
</html>
